name: Malo - Gemini image generation
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Description de l'image à créer"
        required: true
        type: string
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out studio
        uses: actions/checkout@v4
      - name: Generate image securely
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MALO_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Configure GEMINI_API_KEY in repository Actions secrets."
            exit 1
          fi
          python3 scripts/malo_generate.py
      - name: Save image as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: malo-gemini-image
          path: output/malo-image.png
          if-no-files-found: error
          retention-days: 7
