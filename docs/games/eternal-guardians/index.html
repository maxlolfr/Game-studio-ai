<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Eternal Guardians — v0.8</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101127;color:#f9ecff;font-family:system-ui;text-align:center}header{padding:9px}h1{font-size:19px;margin:4px}p{font-size:12px;margin:4px;color:#c5b8dc}canvas{display:block;margin:auto;touch-action:none;background:#101127;border:2px solid #6c527f;max-width:100%;max-height:78vh}button{background:#ffbc6c;color:#24132f;border:0;border-radius:8px;padding:11px 20px;font-weight:bold;margin:8px}</style></head>
<body><header><h1>⚔️ ETERNAL GUARDIANS</h1><p>Kael · Nox · Sol — déplace ton doigt pour esquiver et tirer</p></header><canvas id="game" width="360" height="620" aria-label="Jeu de tir vertical"></canvas><button id="restart">Recommencer</button><button id="pause">Pause</button><button id="power">Pouvoir Sol ✨</button><p id="status" role="status">Survis aux vagues ennemies ! · Record : <span id="best">0</span></p>
<script>
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=c.width,H=c.height;
const $=id=>document.getElementById(id);
let player,enemies,shots,particles,score,lives,frame,raf,targetX,paused=false,over=false,bossSpawned=false,invulnerable=0,solCharge=0,wave=1,best=0;
try{best=Number(localStorage.getItem("eternal-guardians-best")||0)}catch(e){}
$("best").textContent=best;
function reset(){cancelAnimationFrame(raf);player={x:W/2,y:H-75};enemies=[];shots=[];particles=[];score=0;lives=3;frame=0;targetX=player.x;paused=false;over=false;bossSpawned=false;invulnerable=0;solCharge=0;wave=1;$("pause").textContent="Pause";$("status").textContent="Vague 1 · Déplace ton doigt pour esquiver";tick()}
function pointer(e){const rect=c.getBoundingClientRect();targetX=Math.max(22,Math.min(W-22,(e.clientX-rect.left)*W/rect.width))}
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);pointer(e)});c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")pointer(e)});
$("restart").onclick=reset;
$("pause").onclick=()=>{if(over)return;paused=!paused;$("pause").textContent=paused?"Reprendre":"Pause";if(!paused)tick();else $("status").textContent="Jeu en pause"};
$("power").onclick=()=>{if(paused||over)return;if(solCharge<100){$("status").textContent="Pouvoir Sol : "+Math.floor(solCharge)+" %";return}solCharge=0;for(const e of enemies){e.hp-=4;particles.push({x:e.x,y:e.y,t:18})}enemies=enemies.filter(e=>{if(e.hp<=0){score+=e.boss?150:10;return false}return true});$("status").textContent="Sol déclenche une explosion solaire !"};
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function hit(a,b,range){return Math.hypot(a.x-b.x,a.y-b.y)<range}
function hero(){const bob=Math.sin(frame*.12)*2;ctx.save();ctx.translate(player.x,player.y+bob);if(invulnerable>0&&frame%8<4)ctx.globalAlpha=.5;ctx.fillStyle="#d6b5ff";ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-20,23);ctx.lineTo(20,23);ctx.fill();circle(0,-5,15,"#f3d69b");circle(0,-15,13,"#5377c8");ctx.fillStyle="#ffe58a";ctx.fillRect(-3,-30,6,19);ctx.restore();
const wing=Math.sin(frame*.2)*5;circle(player.x-30,player.y+10+wing,10,"#7cd6ff");circle(player.x+30,player.y+10-wing,10,"#ffb44c");circle(player.x-30,player.y+7+wing,4,"#eaffff");circle(player.x+30,player.y+7-wing,4,"#fff2b8")}
function spawn(){const boss=wave%3===0&&!bossSpawned&&frame%600===0;if(boss){enemies.push({x:W/2,y:-40,speed:.7,hp:24,maxHp:24,boss:true,r:33});bossSpawned=true;return}if(frame%Math.max(23,65-wave*3)===0)enemies.push({x:25+Math.random()*(W-50),y:-22,speed:1.3+wave*.28,hp:2+Math.floor(wave/4),r:15,boss:false})}
function tick(){if(paused||over)return;frame++;const newWave=1+Math.floor(frame/600);if(newWave!==wave){wave=newWave;bossSpawned=false;$("status").textContent="Vague "+wave+(wave%3===0?" · Boss en approche !":"")};player.x+=(targetX-player.x)*.22;if(invulnerable>0)invulnerable--;solCharge=Math.min(100,solCharge+.08);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#11182d");g.addColorStop(1,"#39224f");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<38;i++){ctx.fillStyle="#7869a4";ctx.fillRect((i*73+19)%W,(i*137+frame*.55)%H,2,2)}
if(frame%Math.max(15,31-Math.floor(wave/3))===0){shots.push({x:player.x,y:player.y-25,vy:-10});shots.push({x:player.x-30,y:player.y+4,vy:-8,ice:true})}
spawn();
for(const shot of shots){shot.y+=shot.vy;circle(shot.x,shot.y,shot.ice?3:4,shot.ice?"#89eaff":"#ffe88b")}
for(const e of enemies){e.y+=e.speed;if(e.boss){e.x=W/2+Math.sin(frame*.025)*85;circle(e.x,e.y,e.r,"#853f9e");circle(e.x,e.y,17,"#e77cc2");ctx.fillStyle="#ffce7a";ctx.fillRect(e.x-33,e.y-47,66*Math.max(0,e.hp/e.maxHp),5)}else{circle(e.x,e.y,e.r,"#9b4c9e");circle(e.x,e.y,7,"#e99bd6")}
if(e.y>H+40){e.hp=0;if(!e.boss)lives--}if(invulnerable===0&&hit(e,player,e.r+12)){e.hp=0;lives--;invulnerable=70;particles.push({x:e.x,y:e.y,t:20})}
for(const shot of shots){if(shot.y>-10&&hit(e,shot,e.r+4)){e.hp--;shot.y=-100;if(e.hp<=0){score+=e.boss?150:10;solCharge=Math.min(100,solCharge+(e.boss?35:8));particles.push({x:e.x,y:e.y,t:20})}break}}}
enemies=enemies.filter(e=>e.hp>0);shots=shots.filter(x=>x.y>-20);for(const p of particles){circle(p.x,p.y,Math.max(1,20-p.t/2),"#ffd36b");p.t--}particles=particles.filter(p=>p.t>0);
hero();ctx.fillStyle="#fff";ctx.font="bold 15px system-ui";ctx.fillText("Score "+score,12,25);ctx.fillText("♥ ".repeat(Math.max(0,lives)),W-82,25);ctx.fillText("Vague "+wave,12,46);ctx.fillStyle="#4c345d";ctx.fillRect(12,H-18,120,8);ctx.fillStyle="#ffba49";ctx.fillRect(12,H-18,120*solCharge/100,8);
if(lives<=0){over=true;if(score>best){best=score;try{localStorage.setItem("eternal-guardians-best",String(best))}catch(e){}$("best").textContent=best}ctx.fillStyle="#100d20dd";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 28px system-ui";ctx.fillText("FIN DE PARTIE",W/2,H/2);ctx.font="18px system-ui";ctx.fillText("Score "+score+" · Record "+best,W/2,H/2+35);ctx.textAlign="start";$("status").textContent="Partie terminée — recommence pour battre ton record"}else raf=requestAnimationFrame(tick)}
reset();
</script></body></html>
